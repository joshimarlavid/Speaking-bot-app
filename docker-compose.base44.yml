services:
  app:
    image: node:22
    working_dir: /app
    # Dev mode: deps installed into the node_modules volume on start, then the
    # Vite/Express dev server (tsx server.ts) runs from the bind-mounted source.
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev"]
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      # Passed through by the platform; Vite 6.1+ appends this to allowedHosts.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    env_file:
      - /run/base44/app.env
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    restart: on-failure

volumes:
  app_node_modules:
